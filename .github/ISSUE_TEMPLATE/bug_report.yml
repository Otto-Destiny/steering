name: Bug report
description: Report a reproducible problem in STEERING.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Remove API keys, private posts, browser data, databases, and unsanitized logs.
        Report security vulnerabilities privately through SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Submit ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: STEERING version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized diagnostic evidence
      description: Include the command and minimal sanitized traceback or log excerpt.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and private source content.
          required: true
        - label: This is not a security vulnerability.
          required: true
