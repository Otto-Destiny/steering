name: Feature request
description: Propose a focused product or contributor improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should STEERING solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe behavior and how success could be tested.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: trust
    attributes:
      label: Privacy, security, and evidence implications
      description: Note new data, network, secret, browser, or trust-boundary behavior.
  - type: dropdown
    id: interface
    attributes:
      label: Does this affect a schema or MCP interface?
      options: [No, Possibly, Yes]
    validations:
      required: true
