schema_version: 1

inclusion_policy:
  include: >-
    Concrete AI-engineering tools, research methods, architecture patterns, implementation techniques,
    or model-development ideas that could materially affect a future system design, training plan,
    retrieval stack, agent workflow, or inference strategy.
  exclude: >-
    Job and interview content, generic educational lists or glossaries, unrelated end-user products,
    beginner tutorials, and specialized curiosities without a plausible connection to STEERING's
    architecture-time recall mission.
  uncertain: >-
    Keep inaccessible, context-poor, or borderline items in a review queue rather than silently
    including or discarding them.

