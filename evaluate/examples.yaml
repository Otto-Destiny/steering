  sources:
  - candidate_id: candidate-030
    url: https://www.linkedin.com/posts/akshay-pachaar_14x-faster-and-90-cheaper-llm-inference-share-7480336693011615744-eBy6
    canonical_url: https://www.linkedin.com/posts/akshay-pachaar_14x-faster-and-90-cheaper-llm-inference-activity-7480336695922475009-8Jp4
    platform: linkedin
    author: null
    title: LLM Inference Accelerated 14x Faster, 90% Cheaper with LMCache | Akshay Pachaar posted on the topic | LinkedIn
    text: '14x faster and 90% cheaper LLM inference. (100% open-source, KV cache management) LMCache is an open-source KV
      cache management layer that plugs into vLLM, SGLang, and TensorRT-LLM. Here''s how it works: LLMs recompute their understanding
      of the same content on every request. The same system prompts, the same documents, processed from scratch every time,
      and a single GPU throws away roughly 15 TB of this reusable cache per day. LMCache stores that cache and serves it back
      on repeat requests, running as a separate process completely outside the inference engine. The engine just asks for
      the cache blocks it needs. LMCache handles all the heavy data movement across GPU, CPU, disk, and remote storage in
      parallel, so cache work never steals compute from inference. It also reuses cache beyond exact prefixes. Their CacheBlend
      technique (EuroSys 2025 Best Paper) keeps RAG documents cached no matter what order they appear in. On H200s with a
      235B model, that adds up to 14x faster time-to-first-token and 4x faster decoding. And since reuse skips the compute
      entirely (the same reason providers discount cached tokens by 90%), the cost savings follow directly. The repo has the
      full architecture breakdown, benchmarks, and a Kubernetes operator for production use. Link in the first comment. ____
      Share this with your network if you found this insightful ♻️ Follow me (Akshay Pachaar) for more insights and tutorials
      on AI and Machine Learning!'
