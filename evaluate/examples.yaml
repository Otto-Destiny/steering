    url: https://www.linkedin.com/posts/sarthakrastogi_aiagents-llms-ai-share-7479321397568188416-VHwc
    canonical_url: https://www.linkedin.com/posts/sarthakrastogi_aiagents-llms-ai-activity-7480055493156139008-Jc0N
    platform: linkedin
    author: null
    title: '#aiagents #llms #ai | Sarthak Rastogi'
    text: 'This RAG framework is more accurate any other on web data -- because it never reads text. Here''s why (and how
      to use it) -- Most RAG systems convert documents into plain text before indexing them. That works well... until the
      answer depends on the document''s layout. Think about tables, charts, diagrams, dashboards, PDFs, presentations, or
      complex web pages. Flattening everything into text often removes the very information the model needs. A recent open-source
      project by University of California, Berkeley called PixelRAG takes a different approach. Instead of embedding text,
      it first renders every page as screenshots, then creates embeddings directly from those images using a vision-language
      embedding model. They tested it on Wikipedia data (8.28M pages) with a Qwen3-VL embedding model fine-tuned on screenshots.
      It beats text pipelines by 18.1%, performing better on even text-only benchmarks And because it''s operating directly
      on images, it also cuts token cost ~3x through visual compression! During retrieval, the system finds the most relevant
      image tiles, and the VLM reads them just like a human would. This approach preserves visual structure that traditional
      parsing usually discards. Tables remain tables, charts stay intact, and spatial relationships between elements are retained,
      making retrieval much more reliable for visually rich documents. It''s an interesting reminder that better RAG isn''t
      always about larger context windows or smarter chunking. Sometimes the problem is the representation itself. If your
      knowledge base contains PDFs, reports, dashboards, manuals, presentations, or web pages with complex layouts, pixel-based
      retrieval is worth exploring. Truly amazing work by Yichuan Wang and team. ♻️ Share it with anyone building RAG systems
      :) I share tutorials on how to build + improve AI apps and agents, on my newsletter 𝑨𝑰 𝑨𝒈𝒆𝒏𝒕 𝑬𝒏𝒈𝒊𝒏𝒆𝒆𝒓𝒊𝒏𝒈: https://lnkd.in/gaJTcZBR
      Link to repo: https://lnkd.in/erdQauZU #AIAgents #LLMs #AI'
