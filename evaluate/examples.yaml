  - reasoning
  - repetition_control
  - preference_optimization
  sources:
  - candidate_id: candidate-027
    url: https://www.linkedin.com/posts/today-we-release-antidoom-an-open-source-share-7480259901857128449-Emae
    canonical_url: https://www.linkedin.com/posts/liquid-ai-inc_today-we-release-antidoom-an-open-source-activity-7480259904096784385-tRby
    platform: linkedin
    author: null
    title: 'Antidoom: Open-Source Method to Remove Doom Loops in Reasoning Models | Liquid AI posted on the topic | LinkedIn'
    text: 'Today, we release Antidoom, an open-source method that removes a common failure mode in reasoning models: the doom
      loop. A doom loop happens when a model emits a span, then repeats it again and again until the context window runs out.
      Small reasoning models hit it most on long thinking traces and hard math and coding problems. The usual fixes are stopgaps.
      Applying repetition_penalty reweights the entire output distribution and can degrade performance. Reinforcement learning
      can target repetitive looping, but it needs carefully calibrated rewards and costly online rollouts. Our method takes
      a more targeted approach. We find the exact token that begins a loop, train the model to prefer coherent alternatives
      at that one position, and leave the rest of the distribution largely intact. The loop almost always starts on a single
      overtrained token, and in reasoning traces, those are usually interruptives the model has learned to overproduce: "Wait,"
      "So," "Alternatively." Antidoom retrains that first token. It runs on Final Token Preference Optimization (FTPO), a
      preference-optimization algorithm in the DPO family, built to move a handful of tokens with minimal disturbance to the
      model otherwise: > Trains only the trailing token of a sequence, mid-generation > Spreads probability across multiple
      chosen tokens, so it doesn''t just replace one overtrained token with another > Uses a KL-like loss in logit space,
      so training doesn''t disturb the rest of the vocabulary The training teaches the model nothing new about math or code.
      It clears the looping that blocked answers the model could already produce. > Early LFM2.5-2.6B checkpoint: doom-loop
      rate fell from 10.2% to 1.4% > Qwen3.5-4B: fell from 22.9% to 1% under greedy sampling > Eval scores rose across the
      board in both cases, attributable entirely to the drop in looping The whole pipeline runs in a few hours. For a 2-4B
      model, generating the training set takes about two hours on 8 H100s, and training takes one to two hours on a single
      H100. If your small reasoning models loop on hard prompts, Antidoom recovers the accuracy those loops were costing you.
      Generation, detection, and the FTPO trainer are all open source.'
