    url: https://www.linkedin.com/posts/curiouslearner_a-744b-parameter-model-is-running-on-25gb-share-7481655865247379457-R7Mb
    canonical_url: https://www.linkedin.com/posts/curiouslearner_a-744b-parameter-model-is-running-on-25gb-activity-7481655868288200704-FF_R
    platform: linkedin
    author: null
    title: 744B-Parameter Model Runs on 25GB RAM Without GPU | Mayank A. posted on the topic | LinkedIn
    text: 'A 744B-parameter model is running on 25GB of RAM. No GPU required. The clever part is not making the entire model
      fit. It is making sure most of the model never enters RAM. GLM-5.2 is a Mixture-of-Experts model. It contains 744B parameters,
      but activates only around 40B for each token. Even those active weights do not need to be resident at the same time.
      Colibrì treats model execution like a memory hierarchy: → The always-needed weights remain in RAM → 21,504 routed experts
      stay on NVMe → The router selects which experts each layer needs → Those experts are streamed from disk on demand →
      Frequently used experts are cached in spare RAM The full int4 model still occupies roughly 370GB on disk. But only around
      9.9GB remains permanently resident, with peak RAM usage during chat reported at approximately 20GB. A useful way to
      think about it: > RAM holds the hot weights. > NVMe holds the cold weights. > The router decides what must move next.
      The runtime also records which experts your prompts activate most often and automatically pins the hottest ones in spare
      RAM. So repeated use can make it faster, not because the model learns new weights, but because the system learns its
      weight-access pattern. But physics still wins. On the original 25GB machine, cold generation is only around 0.05–0.1
      tokens per second, because each token can require roughly 11GB of disk reads. This is not fast production inference.
      It is a proof of something more interesting: For sparse models, model size and resident memory no longer need to match.
      Inference becomes a systems problem: > Load the right weights. > Cache the hot ones. > Move them before they are needed.
      One important open question remains: the project has not yet completed a full benchmark of how much its int4 quantization
      affects model quality. Pure C. No runtime dependencies. Built as a one-person project on a 12-core laptop. Very impressive
      systems engineering. [GitHub Repo in comments]'
