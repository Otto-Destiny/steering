    url: https://www.linkedin.com/posts/maxime-labonne_what-does-rl-actually-add-on-top-of-sft-share-7482382699752570880-ZRQx
    canonical_url: https://www.linkedin.com/posts/maxime-labonne_what-does-rl-actually-add-on-top-of-sft-activity-7482382702726393856-zuWH
    platform: linkedin
    author: null
    title: 🧱 What does RL actually add on top of SFT? A new paper pins down why the standard recipe, supervised fine-tuning
      (SFT) followed by reinforcement learning (RL), produces reasoning models that solve… | Maxime Labonne | 14 comments
    text: '🧱 What does RL actually add on top of SFT? A new paper pins down why the standard recipe, supervised fine-tuning
      (SFT) followed by reinforcement learning (RL), produces reasoning models that solve problems harder than anything in
      their training set. What''s interesting is that they approach this problem from a different lens: one stage supplies
      the parts, the other learns to recombine them. → SFT supplies the raw material. Its traces always combine the same skills
      in the same order, so the steps never vary independently and the model learns the whole sequence, not the steps as reusable
      units. → RL does the separating. Rewarding only correct final answers, its resampling shows each skill in varied contexts,
      and that variation lets the model isolate each step and recombine them. → RL has to see skills in combination, not in
      isolation. Isolated skills barely move accuracy, around +10%. Multi-step traces gain nearly four times that. The combinations
      have to be in the data, not just the parts. → Skills aren''t the only thing recombined. Routing, which intermediate
      result gets passed to the next step, works the same way, and RL recombines both. → Oddly, the two stages generalize
      best when their training problems don''t overlap at all. Sharing problems barely helped on familiar tasks and hurt generalization
      to new ones. This lines up with the popular "SFT memorizes, RL generalizes" framing, but gives it a mechanism: RL isn''t
      inventing new skills, it''s decomposing and recombining the ones SFT already supplied. That reframes the debate about
      whether RL adds anything beyond the base model. My main caveat is scope: the controlled experiments run on synthetic
      string transformations with 24 skills and 10 routing rules, and the real-model check is small (Qwen3-4B on a few hundred
      MATH problems). The obvious next step: can you design SFT data specifically to maximize the module combinations RL is
      able to recombine later?'
    discovered_urls: []
