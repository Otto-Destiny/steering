      social_statement: Runs on your infrastructure and your data stays yours.
      source_statement: Sessions and artifacts are local, but hosted model requests go directly to the selected provider and Atlas offers managed models and cloud compute.
      explanation: Data locality depends on the chosen model and compute configuration; it is not guaranteed by the local workspace alone.

