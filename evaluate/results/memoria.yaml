knowledge:
  artifact:
    title: Memoria
    kind: open_source_agent_memory_system
    license: Apache-2.0
    implementation: primarily_Rust
    maturity: released_but_requires_local_validation
  concise_idea: >-
    A persistent MCP-accessible agent-memory layer built on MatrixOne that applies database-native
    snapshots, branches, diffs, merges, provenance, and rollback to memory mutations.
  capabilities:
    - Git-like snapshots, zero-copy branches, merge, diff, and point-in-time rollback.
    - Hybrid vector and full-text retrieval across persistent memory types.
    - Contradiction detection, low-confidence quarantine, reflection, and audit trails.
    - Cloud mode or self-hosted Docker deployment with a local embedding option.
    - MCP integration with Codex, Claude Code, Cursor, Gemini CLI, Kiro, and other compatible agents.
  method:
    - Store canonical memories in MatrixOne using immutable storage, MVCC, and Copy-on-Write versioning.
    - Expose store, retrieve, search, correct, purge, snapshot, branch, merge, and governance operations as agent tools.
    - Use steering rules to guide retrieval, memory hygiene, session lifecycle, and safe branching workflows.
  requirements:
    - Memoria CLI and an MCP-compatible agent.
    - A cloud token, or Docker plus MatrixOne for self-hosting.
    - An embedding configuration chosen before first self-hosted startup because vector dimension is schema-locked.
  evidence:
    - "The README documents the claimed versioning, retrieval, governance, deployment, and MCP operations."
    - "The repository contains released code, tests, deployment files, and an Apache-2.0 license."
    - "No independent agent-quality or hallucination-reduction benchmark is presented in the selected README."
  limitations:
    - Product claims are primarily maintainer-reported and need workload-specific evaluation.
    - Self-hosting introduces MatrixOne, Docker, embedding, backup, and operational complexity.
    - Automatic contradiction detection or quarantine can itself make mistakes and needs review and rollback policy.
    - Git-like memory operations do not by themselves establish that stored memories are true or useful.
  engineering_relevance:
    applicability: >-
      Relevant when an agent needs persistent, auditable, reversible memory and isolated experiments
      are more important than using the lightest possible memory store.
    trial_plan:
      - Benchmark retrieval quality, mutation latency, storage growth, rollback correctness, and contradiction false positives.
      - Test a poisoned-memory recovery scenario before production adoption.
      - Compare operational cost with a simpler vector-plus-relational memory implementation.
    adoption_posture: promising_open_source_candidate_requires_benchmarking

