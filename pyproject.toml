[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "steering"
version = "0.1.0"
description = "Local-first AI engineering knowledge and architecture recall"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Destiny Otto" }]
keywords = ["ai-engineering", "knowledge-graph", "mcp", "rag", "architecture"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Pydantic :: 2",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "keyring>=25.7,<26",
  "ladybug==0.18.1",
  "mcp>=1.28,<2",
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6,<7",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.52,<2"]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "httpx2>=2.5,<3",
  "mypy>=1.15,<3",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.2,<5",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.26,<2",
  "pytest-cov>=6.1,<8",
  "ruff>=0.11,<1",
  "types-beautifulsoup4>=4.12,<5",
  "types-pyyaml>=6,<7",
]

[project.scripts]
steering = "steering.cli.main:main"

[project.urls]
Homepage = "https://github.com/Otto-Destiny/steering"
Repository = "https://github.com/Otto-Destiny/steering"
Issues = "https://github.com/Otto-Destiny/steering/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/steering"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["steering"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ladybug", "keyring.*", "pypdf.*", "mcp.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests using a disposable embedded database",
  "e2e: end-to-end interface tests",
  "live: opt-in tests requiring network access or credentials",
  "performance: opt-in performance and scale checks",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["steering"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
